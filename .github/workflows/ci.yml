name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-agent.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-agent.txt
          pip install pytest

      # Les tests utilisent un faux LLM et une base DuckDB locale : aucun secret requis.
      - name: Run tests
        run: python -m pytest tests -q
