services:
  api:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    volumes:
      - ./runs:/app/runs
      - ./outputs:/app/outputs
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    environment:
      API_URL: http://api:8000
    ports: ["8501:8501"]
    depends_on: [api]
